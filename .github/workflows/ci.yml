name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-padelkit:
    name: Test PadelKit (PadelCore)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: swift test
        run: swift test --disable-sandbox

  build-padelui-platforms:
    name: Build PadelUI (${{ matrix.label }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    strategy:
      matrix:
        include:
          - destination: "generic/platform=iOS Simulator"
            label: iOS
          - destination: "generic/platform=watchOS Simulator"
            label: watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: xcodebuild PadelUI for ${{ matrix.label }}
        run: xcodebuild build -scheme PadelUI -destination "${{ matrix.destination }}"
