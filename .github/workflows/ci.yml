name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-padelkit:
    name: Test PadelKit (PadelCore)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: swift test
        run: swift test --disable-sandbox
        env:
          SWIFT_BACKTRACE: enable=yes,cache=no,demangle=yes,symbolicate=full

  build-platforms:
    name: Build ${{ matrix.scheme }} (${{ matrix.label }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    strategy:
      matrix:
        include:
          - scheme: PadelUI
            destination: "generic/platform=iOS Simulator"
            label: iOS
          - scheme: PadelUI
            destination: "generic/platform=watchOS Simulator"
            label: watchOS
          - scheme: PadelData
            destination: "generic/platform=iOS Simulator"
            label: iOS
          - scheme: PadelData
            destination: "generic/platform=watchOS Simulator"
            label: watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: xcodebuild ${{ matrix.scheme }} for ${{ matrix.label }}
        run: xcodebuild build -scheme ${{ matrix.scheme }} -destination "${{ matrix.destination }}"
