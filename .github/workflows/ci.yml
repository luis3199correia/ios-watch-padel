name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-padelkit:
    name: Test PadelKit (PadelCore)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: swift test
        id: swifttest
        run: swift test --disable-sandbox
        continue-on-error: true
      - name: Re-run under lldb to capture a backtrace of the trap
        if: steps.swifttest.outcome == 'failure'
        run: |
          set -x
          BIN_PATH=$(swift build --build-tests --disable-sandbox --show-bin-path)
          BUNDLE="$BIN_PATH/PadelKitPackageTests.xctest/Contents/MacOS/PadelKitPackageTests"
          HELPER="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/libexec/swift/pm/swiftpm-testing-helper"
          lldb --batch \
            -o "process handle SIGTRAP -n true -p true -s true" \
            -o "run" \
            -o "bt all" \
            -o "quit" \
            -- "$HELPER" --test-bundle-path "$BUNDLE" --disable-sandbox "$BUNDLE" --testing-library swift-testing
      - name: Fail job if swift test failed
        if: steps.swifttest.outcome == 'failure'
        run: exit 1

  build-platforms:
    name: Build ${{ matrix.scheme }} (${{ matrix.label }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    strategy:
      matrix:
        include:
          - scheme: PadelUI
            destination: "generic/platform=iOS Simulator"
            label: iOS
          - scheme: PadelUI
            destination: "generic/platform=watchOS Simulator"
            label: watchOS
          - scheme: PadelData
            destination: "generic/platform=iOS Simulator"
            label: iOS
          - scheme: PadelData
            destination: "generic/platform=watchOS Simulator"
            label: watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: xcodebuild ${{ matrix.scheme }} for ${{ matrix.label }}
        run: xcodebuild build -scheme ${{ matrix.scheme }} -destination "${{ matrix.destination }}"
