name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-padelkit:
    name: Test PadelKit (PadelCore)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: swift test
        id: swifttest
        run: swift test --disable-sandbox
        continue-on-error: true
      - name: Dump crash reports on failure
        if: steps.swifttest.outcome == 'failure'
        run: |
          shopt -s nullglob
          reports=(~/Library/Logs/DiagnosticReports/*.ips ~/Library/Logs/DiagnosticReports/*.crash)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No crash reports found in ~/Library/Logs/DiagnosticReports"
          fi
          for f in "${reports[@]}"; do
            echo "=== $f ==="
            cat "$f"
          done
      - name: Fail job if swift test failed
        if: steps.swifttest.outcome == 'failure'
        run: exit 1

  build-platforms:
    name: Build ${{ matrix.scheme }} (${{ matrix.label }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Packages/PadelKit
    strategy:
      matrix:
        include:
          - scheme: PadelUI
            destination: "generic/platform=iOS Simulator"
            label: iOS
          - scheme: PadelUI
            destination: "generic/platform=watchOS Simulator"
            label: watchOS
          - scheme: PadelData
            destination: "generic/platform=iOS Simulator"
            label: iOS
          - scheme: PadelData
            destination: "generic/platform=watchOS Simulator"
            label: watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: xcodebuild ${{ matrix.scheme }} for ${{ matrix.label }}
        run: xcodebuild build -scheme ${{ matrix.scheme }} -destination "${{ matrix.destination }}"
